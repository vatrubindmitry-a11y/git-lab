name: MY
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      run: actions/checkout@v4

    - name: Check README
      run: ls -l && test -f README.txt

    - name: Show message
      run: echo "CI work"
  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
      run: echo "Deploying"
